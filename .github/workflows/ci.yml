name: CBRS-X CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-and-build:
    name: Backend CI (Spring Boot & Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven Tests & Package
        working-directory: backend
        run: mvn -B clean verify

  dashboard-build:
    name: Instructor Dashboard CI (React & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        working-directory: dashboard
        run: npm ci

      # [SEC-12] Dependency audit is a hard gate (no '|| true' suppression)
      - name: Audit NPM Dependencies
        working-directory: dashboard
        run: npm audit --audit-level=high --package-lock-only

      - name: Lint Check
        working-directory: dashboard
        run: npm run lint

      - name: Format Check
        working-directory: dashboard
        run: npm run format:check

      - name: Run Unit Tests
        working-directory: dashboard
        run: npm run test

      - name: Build Production Bundle
        working-directory: dashboard
        run: npm run build

  trainee-view-build:
    name: Trainee View CI (React & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: trainee_view/package-lock.json

      - name: Install Dependencies
        working-directory: trainee_view
        run: npm ci

      # [SEC-12] Dependency audit is a hard gate (no '|| true' suppression)
      - name: Audit NPM Dependencies
        working-directory: trainee_view
        run: npm audit --audit-level=high --package-lock-only

      - name: Lint Check
        working-directory: trainee_view
        run: npm run lint

      - name: Format Check
        working-directory: trainee_view
        run: npm run format:check

      - name: Run Unit Tests
        working-directory: trainee_view
        run: npm run test

      - name: Build Production Bundle
        working-directory: trainee_view
        run: npm run build

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Uncommitted Secrets (.env files)
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file found in repository root!"
            exit 1
          fi

      # [SEC-12] Full-history secret scanning — fails the build on any detected credential
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-containers-validation:
    name: Docker Container Validation
    needs: [backend-test-and-build, dashboard-build, trainee-view-build, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build All Docker Containers via Compose
        run: docker compose build

      # [SEC-12] Container image vulnerability scanning
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cbrsx-cbrsx-backend:latest
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

