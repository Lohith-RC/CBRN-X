global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'cbrsx-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['cbrsx-backend:8080']
        labels:
          application: 'cbrsx-mission-command'
          environment: 'production'
