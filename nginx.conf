user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Rate Limiting Zones ──
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ui_zone:10m rate=60r/s;

    # ── Upstream Definitions ──
    upstream backend {
        server cbrsx-backend:8080;
        keepalive 32;
    }

    upstream admin_dashboard {
        server cbrsx-admin-dashboard:3000;
    }

    upstream trainee_view {
        server cbrsx-trainee-view:5000;
    }

    # ══════════════════════════════════════════════════════
    # 1. Instructor Admin Dashboard & API Gateway (Port 80)
    # ══════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API Proxy to Spring Boot Backend
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # React Dashboard Frontend
        location / {
            limit_req zone=ui_zone burst=100 nodelay;
            proxy_pass http://admin_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ══════════════════════════════════════════════════════
    # 2. Trainee VR View Gateway (Port 5000)
    # ══════════════════════════════════════════════════════
    server {
        listen 5000;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # API Proxy
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Video streams / static assets
        location /videos/ {
            proxy_pass http://trainee_view;
            proxy_buffering off;
        }

        # React Trainee View Frontend
        location / {
            limit_req zone=ui_zone burst=100 nodelay;
            proxy_pass http://trainee_view;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
