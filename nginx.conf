events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rate Limiting Zones ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

    # ── Security: Hide server version ──
    server_tokens off;

    # ── SSL/HTTPS settings (enable for production with valid certs) ──
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # ── Upstream definitions ──
    upstream backend {
        server cbrsx-backend:8080;
        keepalive 32;
    }

    upstream admin_dashboard {
        server cbrsx-admin-dashboard:3000;
    }

    upstream trainee_view {
        server cbrsx-trainee-view:5000;
    }

    # ══════════════════════════════════════════════════════
    # 1. Backend API Proxy (Port 8080)
    # ══════════════════════════════════════════════════════
    server {
        listen 8080;
        server_name localhost;

        # ── Security Headers ──
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Request size limit ──
        client_max_body_size 1m;

        # ── CORS Headers (strict origin validation) ──
        set $cors_origin "";
        if ($http_origin = "http://localhost:3000") {
            set $cors_origin $http_origin;
        }
        if ($http_origin = "http://localhost:5000") {
            set $cors_origin $http_origin;
        }

        location / {
            # Rate limiting
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CORS - only set header when origin is in allowlist
            if ($cors_origin != "") {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, X-API-Key' always;
                add_header 'Access-Control-Max-Age' '3600' always;
            }

            if ($request_method = 'OPTIONS') {
                if ($cors_origin != "") {
                    add_header 'Access-Control-Allow-Origin' '$cors_origin';
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, X-API-Key';
                    add_header 'Access-Control-Max-Age' '3600';
                }
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # ── Block access to sensitive paths ──
        location ~ /\. {
            deny all;
            return 404;
        }
    }

    # ══════════════════════════════════════════════════════
    # 2. Admin Dashboard Proxy (Port 3000)
    # ══════════════════════════════════════════════════════
    server {
        listen 3000;
        server_name localhost;

        # ── Security Headers ──
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'" always;

        # Rate limiting
        limit_req zone=general_limit burst=30 nodelay;

        location / {
            proxy_pass http://admin_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ══════════════════════════════════════════════════════
    # 3. Trainee View Proxy (Port 5000)
    # ══════════════════════════════════════════════════════
    server {
        listen 5000;
        server_name localhost;

        # ── Security Headers ──
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'" always;

        # Rate limiting
        limit_req zone=general_limit burst=30 nodelay;

        location / {
            proxy_pass http://trainee_view;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
