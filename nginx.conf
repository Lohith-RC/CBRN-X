events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # CORS Headers Map
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" "$http_origin";
        "http://localhost:5000" "$http_origin";
    }

    # 1. Reverse Proxy for Backend Engine (Port 8080)
    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://cbrsx-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable CORS for Port 3000 & Port 5000
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # 2. Reverse Proxy for Admin Interface (Port 3000)
    server {
        listen 3000;
        server_name localhost;

        location / {
            proxy_pass http://cbrsx-admin-dashboard:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 3. Reverse Proxy for Trainee Simulation Interface (Port 5000)
    server {
        listen 5000;
        server_name localhost;

        location / {
            proxy_pass http://cbrsx-trainee-view:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
