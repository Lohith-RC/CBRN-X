spring:
  sql:
    init:
      # Load demo seed rows only for local development. Production keeps
      # schema.sql initialization but never receives demo data.
      data-locations: classpath:data-demo.sql
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cbrsx: DEBUG
