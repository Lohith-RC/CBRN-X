server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      # Cap interactive instructor sessions at 30 minutes of inactivity
      timeout: 30m
      cookie:
        # SameSite=Lax + HttpOnly harden the instructor session cookie against
        # cross-site attachment and script theft; CSRF is enforced separately.
        # Enable CBRSX_SESSION_COOKIE_SECURE=true once TLS terminates at the gateway.
        same-site: lax
        http-only: true
        secure: ${CBRSX_SESSION_COOKIE_SECURE:false}
  # Security headers
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: cbrsx-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:cbrsx_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      # [R2-04] Default to 'none' for security; dev profile (application-dev.yml) explicitly uses 'update'
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: always
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: cbrsx-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99

# OpenAPI / Swagger Documentation (disabled in prod via application-prod.yml)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# CORS & Security Configuration
cbrsx:
  cors:
    # localhost:8080 covers the dashboard served directly by Spring in
    # single-origin deployments (WebSocket handshake validates Origin too)
    allowed-origins: ${CBRSX_CORS_ORIGINS:http://localhost:3000,http://localhost:5000,http://localhost:8080}
  # Master API key (grants all roles: ADMIN, INSTRUCTOR, SIMULATION, TRAINEE)
  # Generate with: openssl rand -hex 32
  api-key: ${CBRSX_API_KEY:}
  # Role-specific API keys for least-privilege deployments
  api-keys:
    instructor: ${CBRSX_INSTRUCTOR_KEY:}
    simulation: ${CBRSX_SIMULATION_KEY:}
    trainee: ${CBRSX_TRAINEE_KEY:}
  security:
    fail-closed: ${CBRSX_FAIL_CLOSED:false}
  # Initial administrator account (seeded only when instructor_users is empty).
  # ALWAYS override the password via CBRSX_ADMIN_PASSWORD outside local dev.
  admin:
    username: ${CBRSX_ADMIN_USERNAME:admin}
    password: ${CBRSX_ADMIN_PASSWORD:ndrf-admin-123}
  crypto:
    salt: ${CBRSX_CRYPTO_SALT:CBRSX_TAMPER_EVIDENT_SALT_NDRF_2026}
