server:
  port: 8080

spring:
  application:
    name: cbrsx-backend
  datasource:
    # Default to local H2 in-memory DB if PostgreSQL environment variables are not set
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:cbrsx_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# CORS Configuration
cbrsx:
  cors:
    allowed-origins: "*"
