spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://cbrsx-db:5432/cbrsx}
    username: ${SPRING_DATASOURCE_USERNAME:cbrsx}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: validate
    show-sql: false
server:
  servlet:
    session:
      cookie:
        # Sessions ride TLS behind the gateway in production
        secure: true

management:
  endpoint:
    health:
      show-details: never

# [SEC-08] Do not expose API documentation surface publicly in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.cbrsx: INFO
    org.hibernate.SQL: WARN

cbrsx:
  security:
    fail-closed: true
