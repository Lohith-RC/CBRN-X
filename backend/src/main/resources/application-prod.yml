spring:
  datasource:
    # Defaults match the docker-compose Postgres published on localhost:5432
    # (cbrsx_db / postgres). Always override via env in real deployments.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cbrsx_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.cbrsx: INFO
    org.hibernate.SQL: WARN

cbrsx:
  security:
    fail-closed: true
