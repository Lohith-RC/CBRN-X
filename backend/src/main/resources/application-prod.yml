spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://cbrsx-db:5432/cbrsx}
    username: ${SPRING_DATASOURCE_USERNAME:cbrsx}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.cbrsx: INFO
    org.hibernate.SQL: WARN

cbrsx:
  security:
    fail-closed: true
