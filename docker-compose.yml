version: '3.8'

services:
  # 1. PostgreSQL Database Service
  cbrsx-db:
    image: postgres:15-alpine
    container_name: cbrsx-db
    environment:
      POSTGRES_DB: cbrsx_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cbrsx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot Core Backend Service (Port 8080)
  cbrsx-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cbrsx-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cbrsx-db:5432/cbrsx_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      cbrsx-db:
        condition: service_healthy
    networks:
      - cbrsx-net

  # 3. Admin / Instructor Dashboard Interface (Port 3000)
  cbrsx-admin-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: cbrsx-admin-dashboard
    ports:
      - "3000:3000"
    environment:
      VITE_BACKEND_URL: http://localhost:8080
    networks:
      - cbrsx-net
    depends_on:
      - cbrsx-backend

  # 4. Trainee VR Simulation Interface (Port 5000)
  cbrsx-trainee-view:
    build:
      context: ./trainee_view
      dockerfile: Dockerfile
    container_name: cbrsx-trainee-view
    ports:
      - "5000:5000"
    environment:
      VITE_BACKEND_URL: http://localhost:8080
    networks:
      - cbrsx-net
    depends_on:
      - cbrsx-backend

  # 5. Nginx Reverse Proxy (Port Routing & SSL Termination)
  nginx-proxy:
    image: nginx:alpine
    container_name: cbrsx-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cbrsx-backend
      - cbrsx-admin-dashboard
      - cbrsx-trainee-view
    networks:
      - cbrsx-net

networks:
  cbrsx-net:
    driver: bridge

volumes:
  pgdata:
