version: '3.8'

services:
  # 1. PostgreSQL Database Service
  cbrsx-db:
    image: postgres:15-alpine
    container_name: cbrsx-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cbrsx_db}
      POSTGRES_USER: ${POSTGRES_USER:-cbrsx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Only expose internally within Docker network, not to host
      # Remove host mapping if database should not be accessed from host
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cbrsx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbrsx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Spring Boot Core Backend Service (Port 8080)
  cbrsx-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cbrsx-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cbrsx-db:5432/${POSTGRES_DB:-cbrsx_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cbrsx}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CBRSX_API_KEY: ${CBRSX_API_KEY:?Set CBRSX_API_KEY in .env}
      CBRSX_CORS_ORIGINS: ${CBRSX_CORS_ORIGINS:-http://localhost:3000,http://localhost:5000}
    depends_on:
      cbrsx-db:
        condition: service_healthy
    networks:
      - cbrsx-net
    restart: unless-stopped
    # Resource limits to prevent DoS
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # 3. Admin / Instructor Dashboard Interface (Port 3000)
  cbrsx-admin-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: cbrsx-admin-dashboard
    ports:
      - "3000:3000"
    environment:
      VITE_BACKEND_URL: http://cbrsx-backend:8080
    networks:
      - cbrsx-net
    depends_on:
      - cbrsx-backend
    restart: unless-stopped

  # 4. Trainee VR Simulation Interface (Port 5000)
  cbrsx-trainee-view:
    build:
      context: ./trainee_view
      dockerfile: Dockerfile
    container_name: cbrsx-trainee-view
    ports:
      - "5000:5000"
    environment:
      VITE_BACKEND_URL: http://cbrsx-backend:8080
    networks:
      - cbrsx-net
    depends_on:
      - cbrsx-backend
    restart: unless-stopped

  # 5. Nginx Reverse Proxy (Port Routing & Security Headers)
  nginx-proxy:
    image: nginx:alpine
    container_name: cbrsx-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cbrsx-backend
      - cbrsx-admin-dashboard
      - cbrsx-trainee-view
    networks:
      - cbrsx-net
    restart: unless-stopped

networks:
  cbrsx-net:
    driver: bridge

volumes:
  pgdata:
