name: cbrsx

services:
  cbrsx-db:
    image: postgres:15-alpine
    container_name: cbrsx-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - cbrsx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - cbrsx-net

  cbrsx-backend:
    build: ./backend
    container_name: cbrsx-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://cbrsx-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CBRSX_API_KEY: ${CBRSX_API_KEY:-}
      CBRSX_CORS_ORIGINS: ${CBRSX_CORS_ORIGINS:-http://localhost:80,http://localhost:3000,http://localhost:5000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      cbrsx-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - cbrsx-net

  cbrsx-admin-dashboard:
    build: ./dashboard
    container_name: cbrsx-admin-dashboard
    environment:
      CBRSX_API_KEY: ${CBRSX_API_KEY:-}
    depends_on:
      cbrsx-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - cbrsx-net

  cbrsx-trainee-view:
    build: ./trainee_view
    container_name: cbrsx-trainee-view
    environment:
      CBRSX_API_KEY: ${CBRSX_API_KEY:-}
    depends_on:
      cbrsx-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - cbrsx-net

  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: cbrsx-nginx-proxy
    ports:
      - "80:80"
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cbrsx-admin-dashboard:
        condition: service_healthy
      cbrsx-trainee-view:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - cbrsx-net

volumes:
  cbrsx-pgdata:

networks:
  cbrsx-net:
    driver: bridge
