name: cbrsx

services:
  cbrsx-db:
    image: postgres:15-alpine
    container_name: cbrsx-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cbrsx_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbrsx_secure_postgres_pass_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cbrsx-pgdata:/var/lib/postgresql/data
    networks:
      - cbrsx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cbrsx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  cbrsx-backend:
    build: ./backend
    container_name: cbrsx-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://cbrsx-db:5432/${POSTGRES_DB:-cbrsx_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cbrsx_secure_postgres_pass_2026}
      SPRING_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      CBRSX_API_KEY: ${CBRSX_API_KEY:-cbrsx-sim-secret-key-prod-001}
      # NOTE: fail-closed is forced ON by the 'prod' profile (application-prod.yml);
      # set SPRING_PROFILES_ACTIVE=dev locally if you need fail-open behavior.
      CBRSX_ADMIN_PASSWORD: ${CBRSX_ADMIN_PASSWORD:-ndrf-admin-secure-2026}
      CBRSX_CORS_ORIGINS: ${CBRSX_CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      cbrsx-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - cbrsx-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 512M

  cbrsx-admin-dashboard:
    build: ./dashboard
    container_name: cbrsx-admin-dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    # CBRSX_API_KEY is substituted into the container's nginx template
    # (X-API-Key header injection for proxied /api requests).
    environment:
      CBRSX_API_KEY: ${CBRSX_API_KEY:-cbrsx-sim-secret-key-prod-001}
    networks:
      - cbrsx-net
    depends_on:
      - cbrsx-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

  cbrsx-trainee-view:
    build: ./trainee_view
    container_name: cbrsx-trainee-view
    ports:
      - "${TRAINEE_PORT:-5000}:5000"
    environment:
      CBRSX_API_KEY: ${CBRSX_API_KEY:-cbrsx-sim-secret-key-prod-001}
    networks:
      - cbrsx-net
    depends_on:
      - cbrsx-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

  # Nginx Reverse Proxy & Central Gateway
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: cbrsx-nginx-proxy
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cbrsx-admin-dashboard:
        condition: service_started
      cbrsx-trainee-view:
        condition: service_started
      cbrsx-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - cbrsx-net

volumes:
  cbrsx-pgdata:

networks:
  cbrsx-net:
    driver: bridge
