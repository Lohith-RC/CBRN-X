name: cbrsx

services:
  cbrsx-db:
    image: postgres:15-alpine
    container_name: cbrsx-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cbrsx_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # [SEC-01] Required secret: no default password — compose fails fast if unset in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - cbrsx-pgdata:/var/lib/postgresql/data
    networks:
      - cbrsx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cbrsx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  cbrsx-backend:
    build: ./backend
    container_name: cbrsx-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://cbrsx-db:5432/${POSTGRES_DB:-cbrsx_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      # [SEC-01] Required secrets: no insecure defaults are baked into this file.
      CBRSX_API_KEY: ${CBRSX_API_KEY:?set CBRSX_API_KEY in .env (openssl rand -hex 32)}
      CBRSX_FAIL_CLOSED: ${CBRSX_FAIL_CLOSED:-true}
      CBRSX_SESSION_COOKIE_SECURE: ${CBRSX_SESSION_COOKIE_SECURE:-true}
      CBRSX_ADMIN_PASSWORD: ${CBRSX_ADMIN_PASSWORD:?set CBRSX_ADMIN_PASSWORD in .env}
    # [SEC-10] Backend is internal only: all traffic enters via the nginx gateway
    expose:
      - "8080"
    depends_on:
      cbrsx-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - cbrsx-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 512M

  cbrsx-admin-dashboard:
    build: ./dashboard
    container_name: cbrsx-admin-dashboard
    # [SEC-10] Internal only: reached via the nginx gateway, not exposed to the host
    expose:
      - "3000"
    environment:
      VITE_BACKEND_URL: http://localhost:8080
    networks:
      - cbrsx-net
    depends_on:
      - cbrsx-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

  cbrsx-trainee-view:
    build: ./trainee_view
    container_name: cbrsx-trainee-view
    # [SEC-10] Internal only: reached via the nginx gateway, not exposed to the host
    expose:
      - "5000"
    environment:
      VITE_BACKEND_URL: http://localhost:8080
    networks:
      - cbrsx-net
    depends_on:
      - cbrsx-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

  # Nginx Reverse Proxy & Central Gateway
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: cbrsx-nginx-proxy
    # [SEC-10] Single ingress point: admin dashboard (:80) and trainee view (:5000)
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${TRAINEE_GATEWAY_PORT:-5000}:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cbrsx-admin-dashboard:
        condition: service_started
      cbrsx-trainee-view:
        condition: service_started
      cbrsx-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - cbrsx-net

volumes:
  cbrsx-pgdata:

networks:
  cbrsx-net:
    driver: bridge
